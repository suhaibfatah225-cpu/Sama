<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced English Quiz - Sudanese Curriculum Style</title>
    <style>
      :root {
        --primary-color: #2c3e50;
        --accent-color: #27ae60;
        --warning-color: #e74c3c;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #ecf0f1;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .quiz-container {
        background: white;
        width: 100%;
        max-width: 750px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        overflow: hidden;
        position: relative;
      }

      .header {
        background: var(--primary-color);
        color: white;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .timer-box {
        background: rgba(255,255,255,0.2);
        padding: 8px 15px;
        border-radius: 10px;
        font-weight: bold;
        font-size: 1.2rem;
        border: 1px solid white;
      }

      .part-label {
        background: #f39c12;
        color: white;
        padding: 5px 15px;
        font-size: 0.9rem;
        font-weight: bold;
        text-transform: uppercase;
      }

      .quiz-body {
        padding: 30px;
      }

      .question-box h2 {
        font-size: 1.3rem;
        color: #34495e;
        line-height: 1.6;
        margin-bottom: 25px;
        border-left: 5px solid var(--accent-color);
        padding-left: 15px;
      }

      .options-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .option-btn {
        background: #f8f9fa;
        border: 2px solid #ddd;
        padding: 18px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 1.05rem;
        text-align: left;
        transition: all 0.2s ease;
      }

      .option-btn:hover {
        border-color: var(--accent-color);
        background: #eafaf1;
        transform: translateX(5px);
      }

      .progress-bar {
        height: 6px;
        background: #eee;
        width: 100%;
      }

      .progress-fill {
        height: 100%;
        background: var(--accent-color);
        width: 0%;
        transition: width 0.3s ease;
      }

      .hidden { display: none; }

      .result-screen {
        text-align: center;
        padding: 50px 30px;
      }

      .score-circle {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        border: 10px solid var(--accent-color);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: bold;
        margin: 0 auto 30px;
        color: var(--primary-color);
      }

      .restart-btn {
        background: var(--primary-color);
        color: white;
        border: none;
        padding: 15px 40px;
        border-radius: 10px;
        font-size: 1.1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <div class="quiz-container">
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      
      <div class="header">
        <div>
          <div id="part-name" class="part-label">Part 1: Tenses</div>
        </div>
        <div id="timer" class="timer-box">20:00</div>
      </div>

      <div class="quiz-body" id="quiz-screen">
        <div class="question-box">
          <p id="q-counter" style="color: #7f8c8d; font-weight: bold;">Question 1 / 23</p>
          <h2 id="question-text">Loading question...</h2>
        </div>
        <div class="options-grid" id="options-container"></div>
      </div>

      <div id="result-screen" class="hidden result-screen">
        <h2>Exam Completed</h2>
        <div class="score-circle" id="final-score">0/0</div>
        <p id="feedback-msg" style="margin-bottom: 30px; font-size: 1.2rem; color: #7f8c8d;"></p>
        <button class="restart-btn" onclick="location.reload()">Restart Exam</button>
      </div>
    </div>

    <script>
      // داتا الأسئلة مستخرجة بالكامل من الصورة التي أرسلتها
      const questions = [
        // (1) Tenses Section
        { q: "Look! The Baggara women ________ on their oxen. (ride)", a: "are riding", options: ["ride", "are riding", "rides"], p: "Part 1: Tenses" },
        { q: "Girls usually ________ their mothers. (help)", a: "help", options: ["help", "helping", "helps"], p: "Part 1: Tenses" },
        { q: "Farmers ________ a lot of wheat last year. (grow)", a: "grew", options: ["grow", "grown", "grew"], p: "Part 1: Tenses" },
        { q: "While Amir ________, the light went out. (write)", a: "was writing", options: ["is writing", "was writing", "wrote"], p: "Part 1: Tenses" },
        { q: "The children just ________ their breakfast. (have)", a: "have had", options: ["have had", "had", "has have"], p: "Part 1: Tenses" },
        { q: "Ibrahim ________ a taxi since he was 20 years old. (drive)", a: "has been driving", options: ["drives", "is driving", "has been driving"], p: "Part 1: Tenses" },
        { q: "If we ________ a lot of trees, the amount of oxygen will increase. (plant)", a: "plant", options: ["planted", "plant", "plants"], p: "Part 1: Tenses" },
        { q: "You can lead a horse to water, but you can't make it ________. (drink)", a: "drink", options: ["to drink", "drink", "drinking"], p: "Part 1: Tenses" },
        { q: "During the flood last year many houses ________. (destroy)", a: "were destroyed", options: ["destroyed", "were destroyed", "are destroyed"], p: "Part 1: Tenses" },

        // (I) Prefixes Section
        { q: "This winter is very ________. It is quite warm. (Prefix + usual)", a: "unusual", options: ["inusual", "unusual", "disusual"], p: "Part 2: Prefixes" },
        { q: "Some people look ________. They do little work. (Prefix + active)", a: "inactive", options: ["inactive", "unactive", "disactive"], p: "Part 2: Prefixes" },
        { q: "Children shouldn't ________ their parents. (Prefix + please)", a: "displease", options: ["unplease", "displease", "implease"], p: "Part 2: Prefixes" },
        { q: "Wise people always ________ their difficulties. (Prefix + come)", a: "overcome", options: ["income", "uncome", "overcome"], p: "Part 2: Prefixes" },
        { q: "In the Sudan we don't need to ________ sugar. (Prefix + port)", a: "import", options: ["import", "unport", "disport"], p: "Part 2: Prefixes" },

        // (II) Suffixes Section
        { q: "Sudanese students are always ________. (Suffix + respect)", a: "respectful", options: ["respectful", "respectous", "respectian"], p: "Part 3: Suffixes" },
        { q: "Learning foreign languages is of great ________. (Suffix + important)", a: "importance", options: ["importantal", "importantous", "importance"], p: "Part 3: Suffixes" },
        { q: "Mohamid El Amin is a very popular ________ and singer. (Suffix + music)", a: "musician", options: ["musician", "musical", "musicous"], p: "Part 3: Suffixes" },
        { q: "Driving too fast is always very ________. (Suffix + danger)", a: "dangerous", options: ["dangeral", "dangerous", "dangerful"], p: "Part 3: Suffixes" },
        { q: "In Jabal Marra there are springs with sweet ________ water. (Suffix + nature)", a: "natural", options: ["natureful", "natural", "naturece"], p: "Part 3: Suffixes" },

        // (III) Text Completion Section
        { q: "Fighting against germs takes a lot of ________. (Complete the text)", a: "energy", options: ["too", "feel", "energy"], p: "Part 4: Text Completion" },
        { q: "This is why we often ________ tired when we are sick. (Complete the text)", a: "feel", options: ["feel", "energy", "when"], p: "Part 4: Text Completion" },
        { q: "We should ask a doctor ________ help and advice.", a: "for", options: ["for", "when", "too"], p: "Part 4: Text Completion" },
        { q: "Doctors can help us when we are ________.", a: "ill", options: ["ill", "energy", "too"], p: "Part 4: Text Completion" }
      ];

      let currentIdx = 0;
      let score = 0;
      let timeLimit = 1200; // 20 minutes
      let timer;

      function startExam() {
        renderQuestion();
        timer = setInterval(updateTimer, 1000);
      }

      function updateTimer() {
        timeLimit--;
        let m = Math.floor(timeLimit / 60);
        let s = timeLimit % 60;
        document.getElementById("timer").innerText = `${m}:${s < 10 ? '0' + s : s}`;
        if(timeLimit <= 0) finishExam();
      }

      function renderQuestion() {
        const item = questions[currentIdx];
        document.getElementById("part-name").innerText = item.p;
        document.getElementById("q-counter").innerText = `Question ${currentIdx + 1} / ${questions.length}`;
        document.getElementById("question-text").innerText = item.q;
        
        const container = document.getElementById("options-container");
        container.innerHTML = "";
        
        item.options.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerText = opt;
          btn.onclick = () => selectAnswer(opt);
          container.appendChild(btn);
        });

        const progress = ((currentIdx + 1) / questions.length) * 100;
        document.getElementById("progress-fill").style.width = progress + "%";
      }

      function selectAnswer(choice) {
        if(choice === questions[currentIdx].a) score++;
        currentIdx++;
        if(currentIdx < questions.length) renderQuestion();
        else finishExam();
      }

      function finishExam() {
        clearInterval(timer);
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("final-score").innerText = `${score} / ${questions.length}`;
        
        let msg = "";
        const percent = (score / questions.length) * 100;
        if(percent >= 80) msg = "Excellent! You are a master of grammar.";
        else if(percent >= 50) msg = "Well done! You passed the test.";
        else msg = "You need more practice. Don't give up!";
        document.getElementById("feedback-msg").innerText = msg;
      }

      startExam();
    </script>
  </body>
</html>
